[env]
# vprintf callback. refer to https://github.com/bytecodealliance/wasm-micro-runtime/blob/main/doc/build_wamr.md?plain=1#L193
#WAMR_BH_VPRINTF = ""

# for a new platform , please refer to https://github.com/bytecodealliance/wasm-micro-runtime/blob/main/doc/port_wamr.md#wamr-porting-guide
# need to prepare relative stuff and set the following variables
# - WAMR_BUILD_PLATFORM
# - WAMR_BUILD_TARGET
# - WAMR_SHARED_PLATFORM_CONFIG

# for an existing platform, following variables are required:
# - WAMR_BUILD_PLATFORM
# - WAMR_BUILD_TARGET
#
# default combination is "linux" and "X86_64" and for convenience, you don't need to set them.
#
# for a non-default platform, you need to set the following variables.
# please refer to CMakeLists.txt in https://github.com/bytecodealliance/wasm-micro-runtime/tree/main/product-mini/platforms for more details.
# - WAMR_BUILD_PLATFORM. Options are "alios-things", "android", "cosmopolitan", "darwin", "freebsd", "linux", "linux-sgx", "nuttx", "riot", "rt-thread", "vsworks", "windows", "zephyr"
# - WAMR_BUILD_TARGET. Options are "X86_64", "AMD_64", "X86_32", "AARCH64[sub]", "ARM[sub]", "THUMB[sub]", "MIPS", "RISCV64[sub]", "RISCV32[sub]"
# - WAMR_SHARED_PLATFORM_CONFIG. path to a custom platform CMake file
#
# The supported bare-metal target of this project is the RISC-V based ESP32-C
# series, which uses "RISCV32". Xtensa targets are not supported.

#WAMR_BUILD_PLATFORM = "OS name"
#WAMR_BUILD_TARGET = "CPU architecture"
#WAMR_SHARED_PLATFORM_CONFIG = "path/to/platform.cmake"

# LLVM CMake config directory. Only needed to build the `wamrc` AOT compiler
# (feature `wamrc`) or to enable `llvmjit`. Set it for the local LLVM install,
# e.g.:
#   Linux:   /usr/lib/llvm-18/lib/cmake/llvm
#   macOS:   /opt/homebrew/opt/llvm@18/lib/cmake/llvm
#   Windows: C:/Program Files/LLVM/lib/cmake/llvm
# `pixi run just ...` derives it from the pixi environment automatically.
#LLVM_LIB_CFG_PATH = ""
