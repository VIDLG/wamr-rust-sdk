[workspace]
members = ["crates/wamr-sys", "crates/wamr-sys-bindgen"]
exclude = [
    "examples/wasi-hello",
    "resources/test/gcd",
    "resources/test/add-extra",
    ".devcontainer",
    ".github",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0 WITH LLVM-exception"
authors = ["The WAMR Project Developers"]

[package]
name = "wamr-rust-sdk"
description = "The Rust SDK of WAMR"
license.workspace = true
edition.workspace = true
repository = "https://github.com/bytecodealliance/wamr-rust-sdk"
version = "1.0.0"
readme = "README.md"
categories = ["api-bindings", "wasm"]
keywords = ["api-bindings", "wasm", "webassembly"]

[dependencies]
wamr-sys = { path = "crates/wamr-sys", version = "1.0.0" }
thiserror = { version = "2", default-features = false }

[features]
default = ["std"]
# `std` enables APIs that need the standard library (e.g. `Module::from_file`).
# Disable it with `default-features = false` to use the crate on `no_std` targets.
std = []
# Disable the interpreter; only precompiled `.aot` modules can be loaded.
# Requires `wamr-sys/aot-only`; reduces runtime size on MCUs.
aot-only = ["wamr-sys/aot-only"]
custom-section = ["wamr-sys/custom-section"]
dump-call-stack = ["wamr-sys/dump-call-stack"]
hw-bound-check = ["wamr-sys/hw-bound-check"]
llvmjit = ["wamr-sys/llvmjit"]
multi-module = ["wamr-sys/multi-module"]
name-section = ["wamr-sys/name-section"]
# Build the `wamrc` AOT compiler. Only needed to precompile `.wasm` into `.aot`
# in-tree (requires LLVM).
wamrc = ["wamr-sys/wamrc"]
